# TM - #{ticket number} - MPriMCP Rust Rewrite & Self-host
# Builds the MPriMCP Docker image and publishes it to GitHub Container Registry.
#
#   push to main      -> ghcr.io/<owner>/mpri-mcp:sha-<7-char commit>  and  :latest
#   push tag v1.2.3   -> ghcr.io/<owner>/mpri-mcp:1.2.3                and  :sha-<commit>
#
# Deploy a build on the VPS by putting its sha-… tag in MPRIMCP_IMAGE (mpri-mcp/deploy/VPS_SETUP.md).
name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mpri-mcp/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mpri-mcp
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=mprimcp
            org.opencontainers.image.description=Self-hosted MCP server that tracks Vietnamese supermarket prices
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: mpri-mcp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/mpri-mcp
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "MPRIMCP_IMAGE=${IMAGE,,}:sha-${GITHUB_SHA::7}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
