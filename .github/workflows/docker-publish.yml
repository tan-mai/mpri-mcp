# Builds the mpri-mcp Docker image and publishes it to GitHub Container Registry.
#
#   push to main      -> ghcr.io/<owner>/mpri-mcp:sha-<7-char commit>  and  :latest
#   push tag v1.2.3   -> ghcr.io/<owner>/mpri-mcp:1.2.3                and  :sha-<commit>
#   "Run workflow"    -> same as a push of the selected branch
#
# Deploy a specific build on the VPS by putting its sha-… tag in MPRI_IMAGE (see
# mpri-mcp/deploy/VPS_SETUP.md). The run summary shows the exact image URL.
name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Branch pushes that don't touch the app or this workflow are skipped
    # (path filters are not applied to tag pushes).
    paths:
      - "mpri-mcp/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mpri-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.13"
          working-directory: mpri-mcp
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test
        # The suite fakes the browser and AI providers: no Chromium or API keys needed.
        run: uv run pytest -q

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mpri-mcp
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=mpri-mcp
            org.opencontainers.image.description=Market Pricing MCP server

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mpri-mcp
          # Ubuntu VPS on x86_64. For an ARM server (uname -m = aarch64) use
          # "linux/amd64,linux/arm64" (the ARM build is emulated and much slower).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mpri-mcp
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "### Image published"
            echo
            echo "Deploy this build — in the VPS \`.env\`:"
            echo
            echo '```'
            echo "MPRI_IMAGE=${IMAGE,,}:sha-${short_sha}"
            echo '```'
            echo
            echo "then \`docker compose pull && docker compose up -d\`."
            echo
            echo "All tags:"
            echo
            while IFS= read -r tag; do [ -n "$tag" ] && echo "- \`$tag\`"; done <<< "$TAGS"
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
