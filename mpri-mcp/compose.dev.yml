# Local development: the app alone on http://localhost:8000 (no TLS proxy).
#   docker compose -f compose.dev.yml up --build
services:
  mpri-mcp:
    build: .
    env_file: .env
    environment:
      PUBLIC_BASE_URL: http://localhost:8000
      LOG_JSON: "false"
    # TM - #{ticket number} - MPriMCP Agent Crawl & Product Search
    ports:
      - "8000:8000"
    volumes:
      - mpri_dev_data:/app/data
    init: true

volumes:
  mpri_dev_data:
