{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% set layout = "auth" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card">
  <div class="card-body">
    <h1>Sign in</h1>
    <p class="lead">Use the admin account of this server.</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ icon("alert-circle") }}<div class="alert-body">{{ error }}</div></div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field"><span>Username</span>
        <input type="text" name="username" value="{{ username }}" required autocomplete="username" autofocus>
      </label>
      <label class="field"><span>Password</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
